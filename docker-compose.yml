services:
  postgres:
    image: postgres:15-alpine
    container_name: revenue_recovery_postgres
    restart: always
    environment:
      POSTGRES_DB: revenue_recovery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revenue_recovery"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - revenue_net

  redis:
    image: redis:7-alpine
    container_name: revenue_recovery_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - revenue_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revenue_recovery_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-your_openrouter_api_key_here}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/revenue_recovery}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - revenue_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revenue_recovery_worker
    restart: always
    command: rq worker recovery_queue --url redis://redis:6379/0
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-your_openrouter_api_key_here}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/revenue_recovery}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - revenue_net


volumes:
  postgres_data:

networks:
  revenue_net:
    driver: bridge
