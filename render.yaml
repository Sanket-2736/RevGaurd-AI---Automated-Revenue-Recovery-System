services:
  - type: web
    name: revenue-recovery-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: DATABASE_URL
        fromDatabase:
          name: revenue-recovery-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: revenue-recovery-redis
          property: connectionString

  - type: redis
    name: revenue-recovery-redis
    ipAllowList: [] # internal only

databases:
  - name: revenue-recovery-db
    databaseName: revenue_recovery
    user: postgres
